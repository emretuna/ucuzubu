# Railway config-as-code (https://docs.railway.com/reference/config-as-code)
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "uv run --no-sync python -m ucuzu"
restartPolicyType = "ALWAYS"
# Long-polling bot: exactly one replica, never scale out (duplicate replies).
numReplicas = 1